name = "personalwebsite"
main = ".open-next/worker.js"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

# ⚠️ Im Dashboard gesetzte Klartext-Variablen behalten (GITHUB_REPO,
# EINGANG_BUCKET …). Ohne diese Zeile ersetzt jeder Deploy die
# Variablen durch das, was hier steht — also durch nichts —, und
# Hochladen wäre nach dem nächsten Push still gesperrt. Secrets
# (ADMIN_PASSWORT, GITHUB_TOKEN …) bleiben ohnehin erhalten.
keep_vars = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true
head_sampling_rate = 1

# Anmeldebremse für /api/admin/anmelden (lib/admin/zugang.ts,
# anmeldungErlaubt): höchstens 5 Versuche je Minute und IP. Gezählt wird
# bei Cloudflare (Workers Rate Limiting) — der Worker selbst merkt sich
# nichts. namespace_id ist eine frei gewählte Zahl, eindeutig im Konto.
[[ratelimits]]
name = "ANMELDUNG"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
