<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jakob Sax</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --text: #eef0f4;
    --muted: #9aa3b2;
    --accent: #6ee7b7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 4rem 1.5rem;
  }
  main {
    max-width: 640px;
    width: 100%;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 2.5rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  h1 {
    margin: 0 0 0.25rem;
    font-size: 2.2rem;
  }
  .role {
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 1.5rem;
  }
  p.bio {
    color: var(--muted);
    line-height: 1.6;
  }
  .links {
    display: flex;
    gap: 0.75rem;
    margin-top: 2rem;
    flex-wrap: wrap;
  }
  .links a {
    color: var(--bg);
    background: var(--accent);
    text-decoration: none;
    padding: 0.6rem 1.1rem;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.9rem;
  }
  footer {
    text-align: center;
    color: var(--muted);
    margin-top: 2rem;
    font-size: 0.8rem;
  }
</style>
</head>
<body>
  <main>
    <div class="card">
      <h1>Jakob Sax</h1>
      <div class="role">Platzhalter-Rolle / Tagline</div>
      <p class="bio">
        Das ist eine Testseite, um zu sehen, ob Deployment und Bearbeitung dieses Repos funktionieren.
        Inhalt, Design und Struktur werden als nächstes gemeinsam festgelegt.
      </p>
      <div class="links">
        <a href="mailto:hallo@example.com">Kontakt</a>
        <a href="#">LinkedIn</a>
        <a href="#">GitHub</a>
      </div>
    </div>
    <footer>Test-Deploy &middot; personalwebsite</footer>
  </main>
</body>
</html>
